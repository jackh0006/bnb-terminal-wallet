name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm run audit
      - name: Build canonical assets (no .git, no secrets, no node_modules)
        run: |
          VER="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$VER" || { echo "tag/version mismatch"; exit 1; }
          git archive --format=zip --prefix="bnb-terminal-wallet-$VER/" HEAD -o "bnb-terminal-wallet-$VER-linux-amd64.zip"
          sha256sum "bnb-terminal-wallet-$VER-linux-amd64.zip" > "bnb-terminal-wallet-$VER-SHA256SUMS.txt"
      - name: Create release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --clobber "bnb-terminal-wallet-$VER-linux-amd64.zip" "bnb-terminal-wallet-$VER-SHA256SUMS.txt"
          else
            gh release create "${GITHUB_REF_NAME}" --title "BNB Terminal Wallet ${GITHUB_REF_NAME}" --generate-notes "bnb-terminal-wallet-$VER-linux-amd64.zip" "bnb-terminal-wallet-$VER-SHA256SUMS.txt"
          fi
