name: Bug report
description: Report a reproducible, non-security issue
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 'Never include a recovery phrase, private key, password, keystore, API credential, or sensitive address context. Use SECURITY.md for vulnerabilities.'
  - type: input
    id: version
    attributes:
      label: Version and platform
      placeholder: '1.0.0, Node 22, Termux'
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Safe reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
