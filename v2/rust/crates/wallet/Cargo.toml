[package]
name = "bnb-wallet-wallet"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
bip39 = "2"
bip32 = { version = "0.6", features = ["alloc", "secp256k1"] }
k256 = { version = "0.14", features = ["ecdsa"] }
rlp = "0.6"
sha3 = "0.10.8"
thiserror = "2.0.21"
zeroize = "1.9.0"

[dev-dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
